<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice">
<style>
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
  @keyframes flow { from { transform: translateX(0) } to { transform: translateX(-100px) } }
  @keyframes flow2 { from { transform: translateX(-100px) } to { transform: translateX(0) } }
  .ferry { animation: bob 3s ease-in-out infinite; }
  .w1 { animation: flow 6s linear infinite; }
  .w2 { animation: flow2 9s linear infinite; }
</style>
